<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyShop - Store</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #f1f3f6;
      color: #212529;
    }

    /* Navbar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background-color: #131921;
      color: white;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .cart-btn {
      background: #febd69;
      color: #111;
      padding: 8px 14px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }

    /* Layout */
    .container {
      max-width: 1000px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .container h2 {
      margin-bottom: 16px;
      font-size: 20px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 15px;
    }

    .product-card {
      background: white;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    .product-card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .product-card h3 {
      font-size: 14px;
      line-height: 1.3;
      margin-bottom: 6px;
    }

    .product-price {
      font-size: 16px;
      font-weight: bold;
      color: #b12704;
      margin-bottom: 10px;
    }

    .btn-add {
      background: #ffd814;
      border: 1px solid #fcd200;
      border-radius: 18px;
      padding: 7px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }

    /* Sliding Drawer Cart */
    .cart-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 150;
    }

    .cart-overlay.open {
      display: block;
    }

    .cart-sidebar {
      position: fixed;
      top: 0;
      right: -320px;
      width: 300px;
      height: 100%;
      background: white;
      z-index: 200;
      display: flex;
      flex-direction: column;
      box-shadow: -2px 0 10px rgba(0,0,0,0.2);
      transition: right 0.3s ease;
    }

    .cart-sidebar.open {
      right: 0;
    }

    .cart-header {
      padding: 15px;
      background: #232f3e;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .close-btn {
      background: none;
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding: 10px 0;
    }

    .cart-item-info h4 {
      font-size: 13px;
      margin-bottom: 3px;
    }

    .cart-item-info span {
      font-size: 14px;
      font-weight: bold;
      color: #b12704;
    }

    .cart-controls button {
      width: 26px;
      height: 26px;
      font-weight: bold;
      cursor: pointer;
      border: 1px solid #ccc;
      background: #f8f8f8;
      border-radius: 4px;
    }

    .cart-footer {
      padding: 15px;
      border-top: 1px solid #eee;
      background: #fafafa;
    }

    .total-price {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .btn-checkout {
      width: 100%;
      background: #ff9900;
      border: none;
      padding: 11px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="navbar">
    <div class="logo">🛍️ MyShop</div>
    <div class="cart-btn" onclick="toggleCart()">
      🛒 Cart (<span id="cart-count">0</span>)
    </div>
  </header>

  <!-- Products Section -->
  <main class="container">
    <h2>Featured Products</h2>
    <div class="product-grid" id="product-list"></div>
  </main>

  <!-- Cart Drawer -->
  <div class="cart-overlay" id="cart-overlay" onclick="toggleCart()"></div>
  <aside class="cart-sidebar" id="cart-sidebar">
    <div class="cart-header">
      <h3>Your Cart</h3>
      <button class="close-btn" onclick="toggleCart()">&times;</button>
    </div>
    <div class="cart-items" id="cart-items"></div>
    <div class="cart-footer">
      <div class="total-price">Total: ₹<span id="cart-total">0</span></div>
      <button class="btn-checkout" onclick="checkout()">Proceed to Checkout</button>
    </div>
  </aside>

  <script>
    const products = [
      { id: 1, name: "Wireless Earbuds", price: 1299, image: "https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=300" },
      { id: 2, name: "Smart Band 5", price: 1999, image: "https://images.unsplash.com/photo-1575311373937-040b8e1fd5b6?w=300" },
      { id: 3, name: "Leather Wallet", price: 499, image: "https://images.unsplash.com/photo-1627123424574-724758594e93?w=300" },
      { id: 4, name: "Sneakers Shoes", price: 1499, image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=300" }
    ];

    let cart = [];

    const productList = document.getElementById("product-list");
    const cartItemsContainer = document.getElementById("cart-items");
    const cartCount = document.getElementById("cart-count");
    const cartTotal = document.getElementById("cart-total");
    const cartSidebar = document.getElementById("cart-sidebar");
    const cartOverlay = document.getElementById("cart-overlay");

    function renderProducts() {
      productList.innerHTML = products.map(product => `
        <div class="product-card">
          <img src="${product.image}" alt="${product.name}">
          <h3>${product.name}</h3>
          <div class="product-price">₹${product.price}</div>
          <button class="btn-add" onclick="addToCart(${product.id})">Add to Cart</button>
        </div>
      `).join("");
    }

    function toggleCart() {
      cartSidebar.classList.toggle("open");
      cartOverlay.classList.toggle("open");
    }

    function addToCart(productId) {
      const existing = cart.find(i => i.id === productId);
      if (existing) {
        existing.quantity += 1;
      } else {
        const item = products.find(p => p.id === productId);
        cart.push({ ...item, quantity: 1 });
      }
      updateCartUI();
    }

    function changeQuantity(productId, amount) {
      const item = cart.find(i => i.id === productId);
      if (!item) return;
      item.quantity += amount;
      if (item.quantity <= 0) {
        cart = cart.filter(i => i.id !== productId);
      }
      updateCartUI();
    }

    function updateCartUI() {
      const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
      const totalAmount = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

      cartCount.innerText = totalCount;
      cartTotal.innerText = totalAmount;

      if (cart.length === 0) {
        cartItemsContainer.innerHTML = "<p style='text-align:center; margin-top:20px; color:#888;'>Your cart is empty.</p>";
        return;
      }

      cartItemsContainer.innerHTML = cart.map(item => `
        <div class="cart-item">
          <div class="cart-item-info">
            <h4>${item.name}</h4>
            <span>₹${item.price}</span>
          </div>
          <div class="cart-controls">
            <button onclick="changeQuantity(${item.id}, -1)">-</button>
            <span style="margin: 0 6px;">${item.quantity}</span>
            <button onclick="changeQuantity(${item.id}, 1)">+</button>
          </div>
        </div>
      `).join("");
    }

    function checkout() {
      if (cart.length === 0) {
        alert("Cart is empty!");
        return;
      }
      alert(`Order Placed! Total Amount: ₹${cartTotal.innerText}`);
      cart = [];
      updateCartUI();
      toggleCart();
    }

    renderProducts();
  </script>
</body>
    </html>
